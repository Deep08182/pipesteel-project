<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | AR Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/api.js"></script>
    <script>
        // Security guard
        if (!localStorage.getItem('token') || localStorage.getItem('ar_role') !== 'admin') {
            window.location.href = 'admin-login.html';
        }

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#0B1220', 900: '#0B1220', 800: '#111C30' },
                        rust: { DEFAULT: '#C05621', hover: '#B5541F', light: '#E26E33' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-slate-700 h-screen flex overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-navy-900 text-white flex flex-col shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-white/10">
            <div class="flex items-center gap-3">
                <img src="logo.jpg" alt="AR Group" class="h-8 w-auto bg-white rounded p-1">
                <div>
                    <span class="font-bold text-sm">ADMIN PANEL</span>
                    <span class="text-[9px] font-mono text-rust-light block">AR GROUP</span>
                </div>
            </div>
        </div>
        
        <nav class="flex-1 p-4">
            <button onclick="showSection('products')" id="nav-products" class="w-full flex items-center gap-3 px-4 py-3 bg-rust text-white rounded-lg text-sm font-semibold mb-2">
                <i data-lucide="package" class="w-5 h-5"></i> Products
            </button>
            <button onclick="showSection('queries')" id="nav-queries" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-lg text-sm font-semibold text-gray-300">
                <i data-lucide="mail" class="w-5 h-5"></i> Queries
            </button>
        </nav>

        <div class="p-4 border-t border-white/10">
            <div class="text-xs text-gray-400 mb-2">
                <span class="font-mono">Admin:</span>
                <span class="block text-white font-semibold" id="admin-name">Loading...</span>
            </div>
            <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded text-xs font-bold">
                <i data-lucide="log-out" class="w-4 h-4"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Header -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8">
            <h1 class="text-xl font-bold text-navy-900" id="page-title">Products Management</h1>
            <button id="add-product-btn" onclick="openAddProductModal()" class="bg-rust hover:bg-rust-hover text-white px-4 py-2 rounded text-sm font-semibold flex items-center gap-2 hidden">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Product
            </button>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-8">
            <!-- Products Section -->
            <div id="products-section">
                <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase">Image</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase">Product Name</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase">Category</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase">Status</th>
                                <th class="px-6 py-3 text-right text-xs font-bold text-gray-600 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body" class="divide-y divide-gray-100">
                            <tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">Loading products...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Queries Section -->
            <div id="queries-section" class="hidden">
                <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase">ID</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase">Customer</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase">Product</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase">Date</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase">Status</th>
                                <th class="px-6 py-3 text-right text-xs font-bold text-gray-600 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="queries-table-body" class="divide-y divide-gray-100">
                            <tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">Loading queries...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Product Modal -->
    <div id="product-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-bold text-navy-900" id="modal-title">Add New Product</h3>
                <button onclick="closeProductModal()" class="text-gray-400 hover:text-gray-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="product-form" class="p-6 space-y-4">
                <input type="hidden" id="product-id">
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Product Name *</label>
                    <input type="text" id="product-name" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Category *</label>
                        <input type="text" id="product-category" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Tag</label>
                        <input type="text" id="product-tag" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Material</label>
                    <input type="text" id="product-material" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Grades (comma separated)</label>
                    <input type="text" id="product-grades" placeholder="e.g. 1.5mm, 3mm" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Short Description</label>
                    <textarea id="product-desc" rows="3" class="w-full border border-gray-300 rounded px-3 py-2 text-sm"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Image URL</label>
                    <input type="text" id="product-image" placeholder="images/product.jpg" class="w-full border border-gray-300 rounded px-3 py-2 text-sm">
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
                    <button type="button" onclick="closeProductModal()" class="px-4 py-2 border border-gray-300 rounded text-sm font-semibold hover:bg-gray-50">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 bg-rust hover:bg-rust-hover text-white rounded text-sm font-semibold">
                        Save Product
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Query Detail Modal -->
    <div id="query-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-bold text-navy-900" id="query-modal-title">Query Details</h3>
                <button onclick="closeQueryModal()" class="text-gray-400 hover:text-gray-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="query-details" class="p-6">
                <!-- Query details will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let currentSection = 'products';
        let products = [];
        let queries = [];

        // Load admin info
        async function loadAdminInfo() {
            try {
                const user = await api.get('/auth/me');
                document.getElementById('admin-name').textContent = user.name;
            } catch (error) {
                console.error('Error loading admin info:', error);
            }
        }

        // Show section
        function showSection(section) {
            currentSection = section;
            
            // Update nav
            document.getElementById('nav-products').className = section === 'products' 
                ? 'w-full flex items-center gap-3 px-4 py-3 bg-rust text-white rounded-lg text-sm font-semibold mb-2'
                : 'w-full flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-lg text-sm font-semibold text-gray-300 mb-2';
            
            document.getElementById('nav-queries').className = section === 'queries'
                ? 'w-full flex items-center gap-3 px-4 py-3 bg-rust text-white rounded-lg text-sm font-semibold'
                : 'w-full flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-lg text-sm font-semibold text-gray-300';

            // Update title and button
            if (section === 'products') {
                document.getElementById('page-title').textContent = 'Products Management';
                document.getElementById('add-product-btn').classList.remove('hidden');
                document.getElementById('products-section').classList.remove('hidden');
                document.getElementById('queries-section').classList.add('hidden');
                loadProducts();
            } else {
                document.getElementById('page-title').textContent = 'Customer Queries';
                document.getElementById('add-product-btn').classList.add('hidden');
                document.getElementById('products-section').classList.add('hidden');
                document.getElementById('queries-section').classList.remove('hidden');
                loadQueries();
            }
        }

        // Load products
        async function loadProducts() {
            try {
                // Use admin endpoint that requires auth
                const response = await fetch('/api/products/admin/all', {
                    headers: api.getHeaders()
                });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch products');
                }
                
                products = await response.json();
                renderProducts();
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('products-table-body').innerHTML = 
                    '<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Failed to load products: ' + error.message + '</td></tr>';
            }
        }

        // Render products
        function renderProducts() {
            const tbody = document.getElementById('products-table-body');
            
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">No products yet. Click "Add Product" to create one.</td></tr>';
                return;
            }

            tbody.innerHTML = products.map(p => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4">
                        <img src="${p.image_url || 'images/placeholder.png'}" class="w-12 h-12 object-contain rounded border border-gray-200">
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-semibold text-sm text-navy-900">${p.name}</div>
                        <div class="text-xs text-gray-500">${p.material || 'N/A'}</div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600">${p.category}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded text-xs font-semibold ${p.is_active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">
                            ${p.is_active ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="toggleProductStatus('${p.id}')" class="text-xs text-blue-600 hover:text-blue-800 mr-3">
                            ${p.is_active ? 'Deactivate' : 'Activate'}
                        </button>
                        <button onclick="editProduct('${p.id}')" class="text-xs text-rust hover:text-rust-hover mr-3">Edit</button>
                        <button onclick="deleteProduct('${p.id}')" class="text-xs text-red-600 hover:text-red-800">Delete</button>
                    </td>
                </tr>
            `).join('');

            lucide.createIcons();
        }

        // Load queries
        async function loadQueries() {
            try {
                const response = await api.get('/admin/enquiries');
                queries = response;
                renderQueries();
            } catch (error) {
                console.error('Error loading queries:', error);
                document.getElementById('queries-table-body').innerHTML = 
                    '<tr><td colspan="6" class="px-6 py-8 text-center text-red-500">Failed to load queries</td></tr>';
            }
        }

        // Render queries
        function renderQueries() {
            const tbody = document.getElementById('queries-table-body');
            
            if (queries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">No queries yet.</td></tr>';
                return;
            }

            tbody.innerHTML = queries.map(q => `
                <tr class="hover:bg-gray-50 cursor-pointer" onclick="viewQuery('${q.id}')">
                    <td class="px-6 py-4 text-sm font-mono text-navy-900">${q.id}</td>
                    <td class="px-6 py-4">
                        <div class="text-sm font-semibold text-gray-900">${q.customer_name}</div>
                        <div class="text-xs text-gray-500">${q.customer_email}</div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600">${q.product_name}</td>
                    <td class="px-6 py-4 text-xs text-gray-500">${new Date(q.created_at).toLocaleDateString()}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded text-xs font-semibold bg-blue-100 text-blue-700">${q.status}</span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="event.stopPropagation(); viewQuery('${q.id}')" class="text-xs text-rust hover:text-rust-hover">View</button>
                    </td>
                </tr>
            `).join('');

            lucide.createIcons();
        }

        // Product modal functions
        function openAddProductModal() {
            document.getElementById('modal-title').textContent = 'Add New Product';
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('product-modal').classList.remove('hidden');
            document.getElementById('product-modal').classList.add('flex');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
            document.getElementById('product-modal').classList.remove('flex');
        }

        async function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('modal-title').textContent = 'Edit Product';
            document.getElementById('product-id').value = product.id;
            document.getElementById('product-name').value = product.name;
            document.getElementById('product-category').value = product.category;
            document.getElementById('product-tag').value = product.tag || '';
            document.getElementById('product-material').value = product.material || '';
            document.getElementById('product-grades').value = product.grades ? product.grades.join(', ') : '';
            document.getElementById('product-desc').value = product.short_desc || '';
            document.getElementById('product-image').value = product.image_url || '';

            document.getElementById('product-modal').classList.remove('hidden');
            document.getElementById('product-modal').classList.add('flex');
        }

        async function toggleProductStatus(id) {
            if (!confirm('Are you sure you want to change the product status?')) return;
            
            try {
                await api.patch(`/products/${id}/toggle`, {});
                alert('Product status updated!');
                loadProducts();
            } catch (error) {
                alert('Error updating product status: ' + error.message);
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product? This cannot be undone.')) return;
            
            try {
                await api.delete(`/products/${id}`);
                alert('Product deleted successfully!');
                loadProducts();
            } catch (error) {
                alert('Error deleting product: ' + error.message);
            }
        }

        // Handle product form submission
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const productId = document.getElementById('product-id').value;
            const gradesInput = document.getElementById('product-grades').value;
            
            const data = {
                name: document.getElementById('product-name').value,
                category: document.getElementById('product-category').value,
                tag: document.getElementById('product-tag').value || null,
                material: document.getElementById('product-material').value || null,
                grades: gradesInput ? gradesInput.split(',').map(g => g.trim()) : [],
                short_desc: document.getElementById('product-desc').value || null,
                image_url: document.getElementById('product-image').value || null,
                spec_summary: {},
                highlights: []
            };

            try {
                if (productId) {
                    await api.put(`/products/${productId}`, data);
                    alert('Product updated successfully!');
                } else {
                    await api.post('/products', data);
                    alert('Product created successfully!');
                }
                closeProductModal();
                loadProducts();
            } catch (error) {
                alert('Error saving product: ' + error.message);
            }
        });

        // Query modal functions
        function closeQueryModal() {
            document.getElementById('query-modal').classList.add('hidden');
            document.getElementById('query-modal').classList.remove('flex');
        }

        async function viewQuery(id) {
            const query = queries.find(q => q.id === id);
            if (!query) return;

            document.getElementById('query-details').innerHTML = `
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Query ID</label>
                            <p class="text-sm font-mono text-navy-900 mt-1">${query.id}</p>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Status</label>
                            <p class="text-sm mt-1"><span class="px-2 py-1 rounded text-xs font-semibold bg-blue-100 text-blue-700">${query.status}</span></p>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Customer Name</label>
                            <p class="text-sm text-gray-900 mt-1">${query.customer_name}</p>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Email</label>
                            <p class="text-sm text-gray-900 mt-1">${query.customer_email}</p>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Product</label>
                            <p class="text-sm text-gray-900 mt-1">${query.product_name}</p>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Quantity</label>
                            <p class="text-sm text-gray-900 mt-1">${query.quantity}</p>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Message</label>
                        <p class="text-sm text-gray-700 mt-1 bg-gray-50 p-3 rounded">${query.message || 'No message'}</p>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Date Submitted</label>
                        <p class="text-sm text-gray-700 mt-1">${new Date(query.created_at).toLocaleString()}</p>
                    </div>
                </div>
            `;

            document.getElementById('query-modal').classList.remove('hidden');
            document.getElementById('query-modal').classList.add('flex');
        }

        // Logout
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                api.logout();
            }
        }

        // Initialize
        loadAdminInfo();
        showSection('products');
    </script>
</body>
</html>
