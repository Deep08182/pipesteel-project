<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | AR Group & Steelcore</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/api.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#F5F6F8',
                        navy: { DEFAULT: '#0B1220', 900: '#0B1220', 800: '#111C30' },
                        rust: { DEFAULT: '#C05621', hover: '#B5541F', light: '#E26E33' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F5F6F8] text-slate-700 antialiased min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="industrial-site.html" class="flex items-center gap-3">
                <img src="logo.jpg" alt="AR Group" class="h-10 w-auto object-contain hover:opacity-90 transition-opacity">
                <span class="font-extrabold text-navy-900 text-sm hidden sm:block">AR GROUP & STEELCORE</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="industrial-site.html" class="text-xs font-semibold text-gray-500 hover:text-navy-900">
                    Back to Site
                </a>
            </div>
        </div>
    </header>

    <div class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white border border-gray-200 rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
            <!-- Header Banner -->
            <div class="bg-navy-900 p-6 text-white text-center">
                <div class="w-12 h-12 bg-rust/20 text-rust rounded-full flex items-center justify-center mx-auto mb-2">
                    <i data-lucide="user-plus" class="w-6 h-6"></i>
                </div>
                <h2 class="text-xl font-extrabold tracking-tight">Customer Registration</h2>
                <p class="text-xs text-gray-300 mt-1">Create an account to submit and track RFQs.</p>
            </div>

            <div class="p-6">
                <form id="customer-register-form" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-mono font-bold tracking-wide text-gray-700 mb-1.5 uppercase">FULL NAME</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
                            <input type="text" id="reg-name" required class="w-full border border-gray-300 rounded-lg pl-9 pr-3 py-2 text-sm outline-none focus:border-rust" placeholder="e.g. Rahul Sharma">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-mono font-bold tracking-wide text-gray-700 mb-1.5 uppercase">OFFICIAL EMAIL</label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
                            <input type="email" id="reg-email" required class="w-full border border-gray-300 rounded-lg pl-9 pr-3 py-2 text-sm outline-none focus:border-rust" placeholder="e.g. rahul@company.com">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-mono font-bold tracking-wide text-gray-700 mb-1.5 uppercase">PASSWORD</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
                            <input type="password" id="reg-pass" required minlength="6" class="w-full border border-gray-300 rounded-lg pl-9 pr-3 py-2 text-sm outline-none focus:border-rust" placeholder="Minimum 6 characters">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-mono font-bold tracking-wide text-gray-700 mb-1.5 uppercase">CONFIRM PASSWORD</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
                            <input type="password" id="reg-pass-confirm" required minlength="6" class="w-full border border-gray-300 rounded-lg pl-9 pr-3 py-2 text-sm outline-none focus:border-rust" placeholder="Confirm password">
                        </div>
                    </div>

                    <div class="mt-4 text-center text-xs text-gray-500">
                        Already have an account? <a href="login.html" class="text-rust font-bold hover:underline">Log in</a>
                    </div>

                    <button type="submit" class="w-full bg-navy-900 hover:bg-navy-800 text-white font-bold py-3 rounded-lg transition-colors shadow-md text-sm flex items-center justify-center gap-2 mt-4">
                        <i data-lucide="user-plus" class="w-4 h-4"></i> Create Account &rarr;
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-gray-400">
        © 2026 A. R. Laminators. All rights reserved. GST: 24ADLPD9216D1ZV
    </footer>

    <!-- Scripts -->
    <script>
        lucide.createIcons();
        const form = document.getElementById('customer-register-form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-pass').value;
            const confirmPassword = document.getElementById('reg-pass-confirm').value;

            if(password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }

            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Creating Account...';
            
            try {
                const response = await api.post('/auth/register', { name, email, password });
                
                api.setToken(response.token);
                localStorage.setItem('ar_user_name', response.user.name);
                localStorage.setItem('ar_user_email', response.user.email);
                localStorage.setItem('ar_role', response.user.role);

                alert('Registration successful!');
                window.location.href = 'user-dashboard.html';
            } catch (err) {
                alert(err.message || 'Registration failed. Please check your details.');
            } finally {
                submitBtn.innerHTML = '<i data-lucide="user-plus" class="w-4 h-4"></i> Create Account &rarr;';
            }
        });
    </script>
</body>
</html>
